name: Test release

# Builds a signed release APK from any branch and uploads it as a workflow
# artifact. No tag and no GitHub release are created.
on:
  workflow_dispatch:
  # TEMPORARY: remove once the workflow is on the default branch.
  push:
    branches:
      - claude/fervent-fermi-bj2dcq

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: key1
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: themeporter-test-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
