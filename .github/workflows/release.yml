name: Release

on:
  push:
    tags:
      - "v*"
  # Releases the commit it is run on, creating the tag on GitHub, for when a tag can't be pushed directly.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v1.4"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check tag name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "Tag must start with v, got: $TAG"; exit 1 ;;
          esac
          # A manual run builds the commit it runs on, so it must not attach that build to an existing tag.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"; exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: key1
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target only applies when the tag doesn't exist yet, i.e. a manual run.
          notes="docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" \
              app/build/outputs/apk/release/app-release.apk \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --notes-file "$notes"
          else
            gh release create "$TAG" \
              app/build/outputs/apk/release/app-release.apk \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --generate-notes
          fi
